name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-26.04
    container: ghcr.io/icpctools/builder
    steps:
      - uses: actions/checkout@v7.0.1
        with:
         fetch-depth: 0
      # pnpm's native executable needs libatomic, which the builder image doesn't include
      - name: Install libatomic
        run: apt-get update && apt-get install -y --no-install-recommends libatomic1
      - name: Install pnpm and Node
        uses: pnpm/setup@v3.1.1
        with:
          working-directory: CDS/ui
          runtime: node@24
          cache: true
          cache-dependency-path: CDS/ui/pnpm-lock.yaml
          # the ant ui target installs and builds
          install: false
      - name: Build
        run: ant build
      - name: Add run ID
        run: echo $GITHUB_RUN_ID > dist/github_run_id.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: build
          path: dist/*
  push-release:
    runs-on: ubuntu-26.04
    container: ghcr.io/icpctools/website
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
         fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: build
          path: dist
      - name: Create GitHub release
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          export VERSION_PREFIX=$(awk -F '=' '{ print $2 } ' version.properties)
          VERSION=${VERSION_PREFIX}.$(git rev-list $GITHUB_SHA --count)
          RELEASE_COMMIT=$(git rev-parse HEAD)
          curl --silent --show-error --retry 6 --retry-all-errors --max-time 300 -X POST \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            ${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases \
            -d '{"tag_name":"'"v$VERSION"'", "name":"'"v$VERSION"'", "target_commitish":"'"$RELEASE_COMMIT"'","prerelease":true }' | \
            tee ~/new-release.txt
          RELEASE_ID=$(cat ~/new-release.txt | jq .id)
          RELEASE_ASSET_UPLOAD_URL=https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets
          cd dist
          echo "Uploading release $VERSION"
          for zip in *.zip
          do
            echo $zip...
            curl --silent --show-error --retry 6 --retry-all-errors --max-time 300 --data-binary "@$zip" -X POST \
              -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
              -H 'Accept: application/vnd.github.v3+json' \
              -H 'Content-Type: application/zip' \
              ${RELEASE_ASSET_UPLOAD_URL}\?name=$zip \
              | jq .state
            echo $zip.sha256...
            curl --silent --show-error --retry 6 --retry-all-errors --max-time 300 --data-binary "@$zip.sha256" -X POST \
              -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
              -H 'Accept: application/vnd.github.v3+json' \
              -H 'Content-Type: text/plain' \
              ${RELEASE_ASSET_UPLOAD_URL}\?name=$zip.sha256 \
              | jq .state
            echo $zip.sha512...
            curl --silent --show-error --retry 6 --retry-all-errors --max-time 300 --data-binary "@$zip.sha512" -X POST \
              -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
              -H 'Accept: application/vnd.github.v3+json' \
              -H 'Content-Type: text/plain' \
              ${RELEASE_ASSET_UPLOAD_URL}\?name=$zip.sha512 \
              | jq .state
          done
  push-docker:
    runs-on: ubuntu-26.04
    needs: push-release
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
         fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        run: |
          export VERSION_PREFIX=$(awk -F '=' '{ print $2 } ' version.properties)
          VERSION=${VERSION_PREFIX}.$(git rev-list $GITHUB_SHA --count)
          cd build/cds/Docker
          docker build -t ghcr.io/icpctools/cds:${VERSION} --build-arg CDS_VERSION=${VERSION} .
          docker push ghcr.io/icpctools/cds:${VERSION}
  update-website:
    runs-on: ubuntu-26.04
    # The website fetches release data and container image tags when it builds, so wait for the image
    # too - but still update the website for the new release if only the docker push failed
    needs: [push-release, push-docker]
    if: always() && github.ref == 'refs/heads/main' && needs.push-release.result == 'success'
    steps:
      - name: Trigger website rebuild
        run: gh api repos/icpctools/icpctools.github.io/dispatches -f event_type=release -f "client_payload[sha]=$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
  cleanup:
    runs-on: ubuntu-26.04
    needs: [push-release, push-docker]
    if: always() && github.ref == 'refs/heads/main' && needs.push-release.result == 'success'
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      # Number of newest prereleases to keep; full releases are never removed
      KEEP: 25
      # Deletions per run, to stay within the API rate limit while working through a large backlog
      MAX_DELETE: 100
    steps:
      - name: Delete old prereleases and their Docker images
        run: |
          # Releases are listed newest first; delete the oldest prereleases beyond the newest $KEEP
          gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.prerelease) | "\(.id) \(.tag_name)"' \
            | tail -n +$((KEEP + 1)) | tail -n $MAX_DELETE > old-releases.txt
          echo "Deleting $(wc -l < old-releases.txt) prereleases"

          gh api --paginate "orgs/icpctools/packages/container/cds/versions" \
            --jq '.[] | "\(.id) \(.metadata.container.tags | join(","))"' > image-versions.txt

          while read -r id tag; do
            echo "Deleting $tag"
            gh api -X DELETE "repos/$REPO/releases/$id" || echo "::warning::Could not delete release $tag"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" || echo "::warning::Could not delete tag $tag"
            # Only delete images that are tagged with exactly this version, never ones that are also tagged otherwise
            awk -v t="${tag#v}" '$2 == t { print $1 }' image-versions.txt | while read -r version; do
              gh api -X DELETE "orgs/icpctools/packages/container/cds/versions/$version" \
                || echo "::warning::Could not delete image cds:${tag#v}"
            done
          done < old-releases.txt
