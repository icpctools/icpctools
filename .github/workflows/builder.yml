name: Push Builder Docker Image
on:
  push:
    branches:
      - main
    paths:
      - build/builder.Dockerfile
jobs:
  push-builder-docker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
         fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Builder Docker image
        run: |
          cd build
          docker build -t ghcr.io/icpctools/builder:latest -f builder.Dockerfile .
          docker push ghcr.io/icpctools/builder:latest
